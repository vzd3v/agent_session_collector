hub_id = "collector-hub-alpha"

[paths]
root = "/var/lib/agent-session-collector"
mirror = "/var/lib/agent-session-collector/mirror"
archive = "/var/lib/agent-session-collector/archive"
catalog = "/var/lib/agent-session-collector/catalog/sessions.sqlite"
extracted = "/var/lib/agent-session-collector/extracted"

[receive]
allow_delete = false
max_file_size = "2GiB"
unix_name_max_length = 32

[[receive.sender]]
sender_id = "sender-alpha"
sender_slug = "sender-alpha"
receive_user = "asc_upload_alpha"
mirror_group = "asc_mirror_alpha"
mirror = "sender-alpha"

[data_classes.agent_transcript]
raw_hub_allowed = ["collector-hub-alpha"]
redaction_required = false

[index]
interval = "10m"
emit_vl_events = false
vl_endpoint = ""
emit_on_unchanged_every = "24h"

[archive]
enabled = true
quiet_after = "24h"
compression = "zstd"
zstd_level = 6
policy = "replace"
retain_plain_after_archive = "48h"
version_retention = 3
version_retention_days = 30

[retention]
archive_max_age = "0"
archive_max_bytes = "0"
min_free_bytes = "0"
orphan_grace = "0"
delete_mirror_after_archive = true
delete_unknown_after = "0s"
archive_retention_days = "0"

[logging]
format = "json"
level = "info"

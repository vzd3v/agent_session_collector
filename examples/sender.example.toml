sender_id = "sender-alpha"

[hub]
ssh_target = "asc_upload_alpha@collector.example.net"
remote_command = "asc-receive"

[sync]
interval = "10m"
state_path = "/var/lib/agent-session-collector/sender.sqlite"
rsync_path = "/usr/bin/rsync"
bandwidth_limit = ""
max_attempts = 3
backoff = "30s"

[[sources]]
agent = "claude"
user = "alice"
home = "/home/alice"
host_name = "sender-alpha.example.net"
data_class = "agent_transcript"
paths = [".claude/projects"]
metadata = { team = "platform" }

[sources.capture]
subagent_metadata = true
tool_results = false

[[sources]]
agent = "codex"
user = "alice"
home = "/home/alice"
host_name = "sender-alpha.example.net"
env = "sender-alpha/alice"
data_class = "agent_transcript"
paths = [".codex/sessions", ".codex/archived_sessions"]
metadata = { team = "platform" }

[sources.capture]
session_index = true
tool_results = false

[exclude]
patterns = [
  ".codex/auth.json",
  ".codex/cache/**",
  ".codex/*.sqlite*",
  ".claude/paste-cache/**",
  ".claude/file-history/**"
]

[logging]
format = "json"
level = "info"
